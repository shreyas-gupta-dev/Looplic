version: 1
frontend:
  phases:
    preBuild:
      commands:
        # This is an npm-workspaces monorepo: dependencies MUST be installed from
        # the repo root (where package-lock.json + the workspaces live), not from
        # this app root. Amplify starts each phase in the app root (apps/technician).
        - cd ../.. && npm ci
    build:
      commands:
        - export NODE_OPTIONS=--max-old-space-size=4096
        # Amplify WEB_COMPUTE does not inject console env vars into the SSR
        # runtime — only at build time. Persist server-side vars into this app's
        # .env.production (cwd is apps/technician here) so Next.js loads them at
        # runtime (fixes ECONNREFUSED 127.0.0.1:5432 from DATABASE_URL undefined).
        - env | grep -E '^(DATABASE_|SUPABASE_|RESEND_|APP_AWS_|NEXT_PUBLIC_)' >> .env.production
        # Build only this workspace, from the monorepo root.
        - cd ../.. && npm run build -w @looplic/technician
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - ../../node_modules/**/*
      - .next/cache/**/*
